name: Pulse CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test Multi-Module
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 & Maven
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Multi-Module Project
        run: mvn clean compile -B

      - name: Run Unit & Integration Tests
        run: mvn test -B

      - name: Package Microservices & Monolith
        run: mvn package -DskipTests -B

      - name: Upload Monolith Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulse-monolith-jar
          path: pulse-monolith/target/*.jar
          retention-days: 7

      - name: Upload Vehicle Registry Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulse-vehicle-registry-jar
          path: pulse-vehicle-registry/target/*.jar
          retention-days: 7

  dashboard-build:
    name: Build React Dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pulse-dashboard/package-lock.json

      - name: Install Dashboard Dependencies
        run: cd pulse-dashboard && npm ci

      - name: Build Dashboard
        run: cd pulse-dashboard && npm run build
