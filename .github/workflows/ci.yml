name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    name: Backend (build, test, image)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Unit tests, Spring Modulith boundary checks and the Testcontainers smoke test
      - name: Build and test
        run: mvn -B -ntp verify

      - name: Upload application JAR
        uses: actions/upload-artifact@v7
        with:
          name: pulse-app-jar
          path: pulse-monolith/target/pulse-monolith-*.jar
          retention-days: 7

      - name: Upload module documentation
        uses: actions/upload-artifact@v7
        with:
          name: spring-modulith-docs
          path: pulse-monolith/target/spring-modulith-docs
          retention-days: 7

      - name: Build Docker image
        run: docker build -f pulse-monolith/Dockerfile -t pulse-app:${{ github.sha }} .

  k8s-manifests:
    name: Kubernetes manifests render
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Render kustomization
        run: |
          cp k8s/config/secrets.env.example k8s/config/secrets.env
          kubectl kustomize k8s > /dev/null

  k8s-network-policies:
    name: Kubernetes network policies enforced
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # kind ≥ 0.24: its default network plugin enforces NetworkPolicies.
      - name: Create kind cluster
        uses: helm/kind-action@v1.15.2
        with:
          version: v0.33.0

      - name: Only the app reaches Redis, and only with the password
        run: bash k8s/tests/network-policies.sh

  dashboard:
    name: Dashboard (lint, test, build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: pulse-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: pulse-dashboard

      - name: Lint
        run: npm run lint
        working-directory: pulse-dashboard

      - name: Unit tests
        run: npm test
        working-directory: pulse-dashboard

      - name: Build
        run: npm run build
        working-directory: pulse-dashboard
