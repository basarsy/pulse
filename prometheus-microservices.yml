global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'vehicle-registry'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['vehicle-registry:8081']
  - job_name: 'command-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['command-service:8082']
  - job_name: 'ota-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['ota-service:8083']
  - job_name: 'gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['gateway:8080']
