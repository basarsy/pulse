global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'pulse-app'
    metrics_path: '/actuator/prometheus'
    static_configs:
      # The app container in Docker Compose. When running the app from your IDE instead, replace
      # the target with 'host.docker.internal:8080'. Do not list both: while the app container is
      # running, host.docker.internal:8080 reaches the same process via its published port and
      # every series would be scraped twice.
      - targets: ['app:8080']
        labels:
          application: 'pulse-app'
