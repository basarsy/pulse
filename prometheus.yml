global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'pulse-app'
    metrics_path: '/actuator/prometheus'
    static_configs:
      # 'app' when the whole stack runs in Docker Compose,
      # 'host.docker.internal' when the app runs on the host (IDE / spring-boot:run).
      - targets: ['app:8080', 'host.docker.internal:8080']
        labels:
          application: 'pulse-app'
