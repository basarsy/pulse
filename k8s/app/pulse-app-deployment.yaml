apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-app
  labels:
    app: pulse
    component: pulse-app
spec:
  # Safe to scale out:
  #  - live updates: each pod's STOMP broker is in-memory, so pods share updates over Redis
  #    pub/sub (channel pulse:live-updates) and every browser gets every update once
  #  - @Scheduled jobs: each takes a ShedLock row in Postgres (V8) and runs once per interval
  #  - no sticky sessions needed: the dashboard uses a raw WebSocket (one pod per connection);
  #    the SockJS HTTP fallback transports would need them
  replicas: 2
  selector:
    matchLabels:
      app: pulse
      component: pulse-app
  template:
    metadata:
      labels:
        app: pulse
        component: pulse-app
    spec:
      containers:
        - name: pulse-app
          image: pulse-app:0.0.1-SNAPSHOT
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-configmap
            - secretRef:
                name: app-secrets
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 20
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
