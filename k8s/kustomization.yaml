apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pulse

resources:
  - namespace.yaml
  - config/app-configmap.yaml
  - infrastructure/postgres-service.yaml
  - infrastructure/postgres-statefulset.yaml
  - infrastructure/redis-service.yaml
  - infrastructure/redis-deployment.yaml
  - infrastructure/kafka-service.yaml
  - infrastructure/kafka-statefulset.yaml
  - infrastructure/prometheus-configmap.yaml
  - infrastructure/prometheus-service.yaml
  - infrastructure/prometheus-deployment.yaml
  - infrastructure/grafana-service.yaml
  - infrastructure/grafana-deployment.yaml
  - app/pulse-app-service.yaml
  - app/pulse-app-deployment.yaml
  - dashboard/dashboard-service.yaml
  - dashboard/dashboard-deployment.yaml
  - ingress.yaml

# Secrets are generated from a git-ignored env file; see config/secrets.env.example.
secretGenerator:
  - name: app-secrets
    envs:
      - config/secrets.env
