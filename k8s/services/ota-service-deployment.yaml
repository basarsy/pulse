apiVersion: apps/v1
kind: Deployment
metadata:
  name: ota-service
  labels:
    app: pulse
    component: ota-service
    version: latest
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pulse
      component: ota-service
  template:
    metadata:
      labels:
        app: pulse
        component: ota-service
        version: latest
    spec:
      containers:
        - name: ota-service
          image: pulse-ota-service:latest
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: app-configmap
            - secretRef:
                name: app-secrets
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
