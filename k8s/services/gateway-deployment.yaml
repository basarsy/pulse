apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: pulse
    component: gateway
    version: latest
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pulse
      component: gateway
  template:
    metadata:
      labels:
        app: pulse
        component: gateway
        version: latest
    spec:
      containers:
        - name: gateway
          image: pulse-gateway:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-configmap
            - secretRef:
                name: app-secrets
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
