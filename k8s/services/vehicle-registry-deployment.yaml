apiVersion: apps/v1
kind: Deployment
metadata:
  name: vehicle-registry
  labels:
    app: pulse
    component: vehicle-registry
    version: latest
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pulse
      component: vehicle-registry
  template:
    metadata:
      labels:
        app: pulse
        component: vehicle-registry
        version: latest
    spec:
      containers:
        - name: vehicle-registry
          image: pulse-vehicle-registry:latest
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: app-configmap
            - secretRef:
                name: app-secrets
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
