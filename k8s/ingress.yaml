apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pulse-ingress
  labels:
    app: pulse
spec:
  ingressClassName: nginx
  rules:
    - host: pulse.local
      http:
        paths:
          # Paths are forwarded unchanged; the app serves /api/v1/** and /ws-pulse/**.
          # /actuator is intentionally not exposed publicly.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: pulse-app
                port:
                  number: 8080
          - path: /ws-pulse
            pathType: Prefix
            backend:
              service:
                name: pulse-app
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard
                port:
                  number: 80
