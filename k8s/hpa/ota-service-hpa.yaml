apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ota-service-hpa
  labels:
    app: pulse
    component: ota-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ota-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
