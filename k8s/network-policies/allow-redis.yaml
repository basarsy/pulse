# redis: only from the app.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis
  labels:
    app: pulse
spec:
  podSelector:
    matchLabels:
      app: pulse
      component: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: pulse
              component: pulse-app
      ports:
        - port: 6379
          protocol: TCP
