# Kafka: clients from the app; and the broker itself, which reaches its own listener and
# controller through the kafka Service (advertised listener and quorum voter both name it).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kafka
  labels:
    app: pulse
spec:
  podSelector:
    matchLabels:
      app: pulse
      component: kafka
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: pulse
              component: pulse-app
      ports:
        - port: 9092
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app: pulse
              component: kafka
      ports:
        - port: 9092
          protocol: TCP
        - port: 9093
          protocol: TCP
