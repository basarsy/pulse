# No pod in the namespace accepts traffic unless another policy here allows it.
# Policies only take effect where the cluster's network plugin enforces them (kind, k3s, the
# managed clouds; not Docker Desktop's Kubernetes).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels:
    app: pulse
spec:
  podSelector: {}
  policyTypes:
    - Ingress
