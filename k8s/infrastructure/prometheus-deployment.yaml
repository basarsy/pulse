apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app: pulse
    component: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pulse
      component: prometheus
  template:
    metadata:
      labels:
        app: pulse
        component: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          ports:
            - containerPort: 9090
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus/
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
