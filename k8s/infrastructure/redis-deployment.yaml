apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: pulse
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pulse
      component: redis
  template:
    metadata:
      labels:
        app: pulse
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          # Password from app-secrets; the app reads the same key (REDIS_PASSWORD). An empty value would
          # turn authentication off, so Redis refuses to start without one.
          command: ["sh", "-c"]
          args:
            - '[ -n "$REDIS_PASSWORD" ] || { echo "REDIS_PASSWORD is empty" >&2; exit 1; }; exec redis-server --requirepass "$REDIS_PASSWORD"'
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: REDIS_PASSWORD
          ports:
            - containerPort: 6379
          # Ready only once Redis answers an authenticated PING. Without a probe the pod counts as
          # ready when the container starts, before redis-server listens, so the Service sends
          # connections there too early ("Connection refused"). An exec probe runs inside the
          # container, so the network policies don't apply to it.
          readinessProbe:
            exec:
              command: ["sh", "-c", 'redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
