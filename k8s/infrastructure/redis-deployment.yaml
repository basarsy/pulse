apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: pulse
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pulse
      component: redis
  template:
    metadata:
      labels:
        app: pulse
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          # Password from app-secrets; the app reads the same key (REDIS_PASSWORD).
          args: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: REDIS_PASSWORD
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
