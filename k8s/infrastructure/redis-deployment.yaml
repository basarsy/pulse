apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: pulse
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pulse
      component: redis
  template:
    metadata:
      labels:
        app: pulse
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
