apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app: pulse
    component: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'spring-actuator'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets:
            - 'pulse-app:8080'
